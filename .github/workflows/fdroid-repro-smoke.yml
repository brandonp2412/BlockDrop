name: F-Droid Reproducibility Smoke Test (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: android-arm
          - abi: arm64-v8a
            target: android-arm64
          - abi: x86_64
            target: android-x64
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.77
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter SDK and APK verifier
        shell: bash
        run: |
          set -euo pipefail
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter --version
          flutter/bin/flutter config --no-analytics
          flutter/bin/flutter precache --android
          python3 -m venv "$RUNNER_TEMP/repro-venv"
          "$RUNNER_TEMP/repro-venv/bin/pip" install --disable-pip-version-check apksigcopier==1.1.1
          echo "$RUNNER_TEMP/repro-venv/bin" >> "$GITHUB_PATH"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Rebuild unsigned APK using F-Droid flags
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          test ! -e android/key.properties
          flutter build apk --release --split-per-abi --target-platform="$TARGET"

      - name: Compare independently built unsigned APK against GitHub signed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          asset="app-${ABI}-release.apk"
          unsigned="build/app/outputs/flutter-apk/${asset}"
          test -s "$unsigned"
          mkdir -p reference
          gh release download v1.0.77 --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir reference
          test -s "reference/$asset"
          apksigner verify --print-certs "reference/$asset" | grep -F '011ee1a6e4e5ecd675f67fbf3d78ad82614a7a7a3f24ed71cc9c417154a0f0fd'
          if apksigner verify "$unsigned" >/dev/null 2>&1; then
            echo 'Expected F-Droid build to be unsigned' >&2
            exit 1
          fi
          apksigcopier compare --unsigned "reference/$asset" "$unsigned"
          echo "PASS: F-Droid-equivalent unsigned build matches signed release for $ABI"
